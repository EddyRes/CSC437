<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Moogle Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">

  <script type="importmap">
    {
      "imports": {
        "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
        "@unbndl/html": "https://unpkg.com/@unbndl/html",
        "@unbndl/view": "https://unpkg.com/@unbndl/view"
      }
    }
  </script>

  <script type="module">
    import { define } from "@unbndl/html";
    import { Auth } from "@unbndl/auth";
    import { LoginFormElement } from "/js/login-form.js";
    import { MoogleHeaderElement } from "/js/moogle-header.js";

    define({
      "auth-provider": Auth.Provider,
      "login-form": LoginFormElement,
      "moogle-header": MoogleHeaderElement
    });
  </script>
</head>

<body>
  <auth-provider>
    <moogle-header></moogle-header>

    <main class="page-layout">
      <section class="page-card">
        <h2>Create Account</h2>

        <login-form api="/auth/register">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>

          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>

          <span slot="submit-label">Register</span>
        </login-form>

        <p>
          Already have an account? <a href="/login.html">Log in</a>.
        </p>
      </section>
    </main>
  </auth-provider>

  <script src="/scripts/darkmode.js"></script>
</body>
</html>
