<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/page.css">

  <script type="importmap">
    {
      "imports": {
        "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
        "@unbndl/html": "https://unpkg.com/@unbndl/html",
        "@unbndl/view": "https://unpkg.com/@unbndl/view"
      }
    }
  </script>
</head>

<body>
  <auth-provider>
    <moogle-header></moogle-header>

    <main class="home-grid">
      <section class="intro-card">
        <h2>Welcome</h2>
        <p>Welcome to Moogle. Explore songs, artists, albums, genres, playlists, and listeners.</p>
      </section>

      <section class="songs-card">
        <h2>
          Songs
          <svg class="icon" aria-hidden="true">
            <use href="/icons/music.svg#icon-song"></use>
          </svg>
        </h2>

        <moogle-song-list src="/api/songs"></moogle-song-list>
      </section>

      <section class="explore-card">
        <h2>
          Explore More
          <svg class="icon" aria-hidden="true">
            <use href="/icons/music.svg#icon-artist"></use>
          </svg>
        </h2>

        <ul class="item-list">
          <li>
            <svg class="icon" aria-hidden="true">
              <use href="/icons/music.svg#icon-artist"></use>
            </svg>
            <a href="artists/index.html">Artists</a>
          </li>

          <li>
            <svg class="icon" aria-hidden="true">
              <use href="/icons/music.svg#icon-album"></use>
            </svg>
            <a href="albums/index.html">Albums</a>
          </li>

          <li>
            <svg class="icon" aria-hidden="true">
              <use href="/icons/music.svg#icon-genre"></use>
            </svg>
            <a href="genres/index.html">Genres</a>
          </li>

          <li>
            <svg class="icon" aria-hidden="true">
              <use href="/icons/music.svg#icon-playlist"></use>
            </svg>
            <a href="playlists/chill-hits.html">Playlists</a>
          </li>

          <li>
            <svg class="icon" aria-hidden="true">
              <use href="/icons/music.svg#icon-listener"></use>
            </svg>
            <a href="listeners/alex.html">Listeners</a>
          </li>
        </ul>
      </section>
    </main>
  </auth-provider>

  <script type="module">
    import { define } from "@unbndl/html";
    import { Auth } from "@unbndl/auth";

    import { MoogleSongElement } from "/js/moogle-song.js";
    import { MoogleSongListElement } from "/js/moogle-song-list.js";

    import { MoogleHeaderElement } from "/js/moogle-header.js";

    define({
      "auth-provider": Auth.Provider,
      "moogle-header": MoogleHeaderElement,
      "moogle-song": MoogleSongElement,
      "moogle-song-list": MoogleSongListElement
    });
  </script>

  <script src="/scripts/darkmode.js"></script>
</body>
</html>
